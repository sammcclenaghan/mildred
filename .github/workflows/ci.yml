name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Apple Container only runs on macOS 26, so CI covers the host CLI, the
      # tools, and the agent loop (replayed from a VCR cassette). The image
      # build is exercised locally with `rake install`.
      - run: bundle exec rake test
